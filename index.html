<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xbox Dashboard</title>
    <style>
        :root {
            --xbox-green: #107c10;
            --xbox-dark: #101010;
            --xbox-gray: #1e1e1e;
            --xbox-light-gray: #2b2b2b;
            --text-main: #ffffff;
        }

        body {
            background-color: var(--xbox-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            overflow: hidden; /* Keeps it feeling like an app */
            height: 100vh;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            padding: 20px 50px;
            gap: 40px;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            position: relative;
        }

        nav span { 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 1.1rem; 
            opacity: 0.5; 
            transition: 0.2s; 
            text-transform: uppercase;
        }

        nav span:hover { opacity: 0.8; }
        nav span.active { opacity: 1; border-bottom: 4px solid var(--xbox-green); }

        /* Content Container */
        .content-wrapper {
            height: calc(100vh - 80px);
            overflow-y: auto;
            padding: 20px 50px;
        }

        .page { display: none; animation: fadeIn 0.3s ease-in; }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* Tile Styling */
        .tile {
            background: var(--xbox-light-gray);
            border: 4px solid transparent;
            aspect-ratio: 16/9;
            cursor: pointer;
            transition: 0.2s;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
        }

        .tile:hover {
            transform: scale(1.05);
            border-color: white;
            box-shadow: 0 0 20px rgba(16, 124, 16, 0.5);
        }

        .tile-label {
            background: rgba(0,0,0,0.8);
            padding: 8px;
            width: 100%;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* Game Player Overlay */
        #game-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 200;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--xbox-green);
            color: white;
            padding: 10px 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            z-index: 201;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-store {
            background: var(--xbox-green);
            border: none;
            color: white;
            padding: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }

        #toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            border-left: 5px solid var(--xbox-green);
            padding: 15px;
            display: none;
            z-index: 300;
        }
    </style>
</head>
<body>

<nav id="main-nav">
    <span onclick="showPage('home')" id="nav-home" class="active">Home</span>
    <span onclick="showPage('gallery')" id="nav-gallery">My Games</span>
    <span onclick="showPage('store')" id="nav-store">Store</span>
</nav>

<div class="content-wrapper">
    <div id="home" class="page active">
        <h1>Hi William</h1>
        <div id="home-grid" class="grid"></div>
    </div>

    <div id="gallery" class="page">
        <h1>My Collection</h1>
        <div id="gallery-grid" class="grid"></div>
    </div>

    <div id="store" class="page">
        <h1>Xbox Store</h1>
        <div id="store-grid" class="grid"></div>
    </div>
</div>

<div id="game-screen">
    <button class="back-btn" onclick="closeGame()"> BACK TO DASHBOARD</button>
    <iframe id="game-frame" src=""></iframe>
</div>

<div id="toast">Achievement Unlocked!</div>

<script>
    const allGames = [
        { id: 1, name: "2048", url: "https://gabrielecirulli.github.io/2048/", img: "https://upload.wikimedia.org/wikipedia/commons/1/18/2048_logo.svg" },
        { id: 2, name: "Hextris", url: "https://hextris.github.io/hextris/", img: "https://hextris.github.io/hextris/images/icon.png" },
        { id: 3, name: "Clumsy Bird", url: "https://ellisonleao.github.io/clumsy-bird/", img: "https://ellisonleao.github.io/clumsy-bird/data/img/bg.png" },
        { id: 4, name: "Sinuous", url: "https://sinuousgame.com/", img: "https://sinuousgame.com/favicon.ico" },
        { id: 5, name: "Snake", url: "https://patorjk.com/games/snake/", img: "https://play-lh.googleusercontent.com/9T3o9vHhX0uY1T0b7I0jX0zX" },
        { id: 6, name: "Pacman", url: "https://google-pacman.github.io/", img: "https://upload.wikimedia.org/wikipedia/commons/4/49/Pacman.svg" },
        { id: 7, name: "Doodle Jump", url: "https://doodlejump.io/", img: "https://play-lh.googleusercontent.com/97y_D9v6p0yR" },
        { id: 8, name: "Tetris", url: "https://chvin.github.io/react-tetris/", img: "https://upload.wikimedia.org/wikipedia/commons/7/7c/Tetris_logo.png" }
    ];

    let myLibrary = JSON.parse(localStorage.getItem('xboxLibrary')) || [];

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav span').forEach(s => s.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.getElementById('nav-' + pageId).classList.add('active');
        render();
    }

    function buyGame(id) {
        if(!myLibrary.includes(id)) {
            myLibrary.push(id);
            localStorage.setItem('xboxLibrary', JSON.stringify(myLibrary));
            showToast("Game Installed!");
            render();
        }
    }

    function playGame(url) {
        document.getElementById('game-frame').src = url;
        document.getElementById('game-screen').style.display = 'block';
    }

    function closeGame() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('game-frame').src = "";
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    function render() {
        const storeGrid = document.getElementById('store-grid');
        const galleryGrid = document.getElementById('gallery-grid');
        const homeGrid = document.getElementById('home-grid');

        storeGrid.innerHTML = '';
        galleryGrid.innerHTML = '';
        homeGrid.innerHTML = '';

        allGames.forEach(game => {
            const isOwned = myLibrary.includes(game.id);
            
            const card = `
                <div class="tile" style="background-image: linear-gradient(transparent, black), url('${game.img}')" onclick="${isOwned ? `playGame('${game.url}')` : ''}">
                    <div class="tile-label">
                        ${game.name}
                        ${!isOwned ? `<button class="btn-store" onclick="event.stopPropagation(); buyGame(${game.id})">FREE - GET</button>` : ''}
                    </div>
                </div>
            `;

            if (isOwned) {
                galleryGrid.innerHTML += card;
                homeGrid.innerHTML += card; 
            } else {
                storeGrid.innerHTML += card;
            }
        });
    }

    render();
</script>

</body>
</html>
