<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xbox Web Dashboard</title>
    <style>
        :root {
            --xbox-green: #107c10;
            --xbox-dark: #101010;
            --xbox-gray: #1e1e1e;
            --xbox-light-gray: #2b2b2b;
            --text-main: #ffffff;
        }

        body {
            background-color: var(--xbox-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            padding: 30px 50px;
            gap: 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        nav span { 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 1.2rem; 
            opacity: 0.5; 
            transition: 0.2s; 
            text-transform: uppercase;
        }

        nav span:hover { opacity: 0.8; }
        nav span.active { opacity: 1; border-bottom: 4px solid var(--xbox-green); }

        /* Main Content Area */
        .page { display: none; padding: 0 50px; animation: fadeIn 0.3s ease-in; }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Tile Styling */
        .tile {
            background: var(--xbox-light-gray);
            border: 3px solid transparent;
            aspect-ratio: 1/1;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .tile:hover {
            transform: scale(1.05);
            border-color: white;
            z-index: 10;
        }

        .tile-label {
            background: rgba(0,0,0,0.8);
            padding: 10px;
            font-weight: bold;
        }

        .btn-action {
            background: var(--xbox-green);
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }

        .btn-action:hover { background: #159c15; }

        /* Notification Pop */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--xbox-light-gray);
            border-left: 5px solid var(--xbox-green);
            padding: 15px 30px;
            border-radius: 5px;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

<nav>
    <span onclick="showPage('home')" id="nav-home" class="active">Home</span>
    <span onclick="showPage('gallery')" id="nav-gallery">My Games</span>
    <span onclick="showPage('store')" id="nav-store">Store</span>
</nav>

<div id="home" class="page active">
    <h1>Welcome back, William</h1>
    <p>Jump back into your recently played games.</p>
    <div id="home-grid" class="grid">
        </div>
</div>

<div id="gallery" class="page">
    <h1>My Games & Apps</h1>
    <div id="gallery-grid" class="grid"></div>
</div>

<div id="store" class="page">
    <h1>Microsoft Store</h1>
    <div id="store-grid" class="grid"></div>
</div>

<div id="toast">Achievement Unlocked: Game Added!</div>

<script>
    // Game Database
    const allGames = [
        { id: 1, name: "2048", url: "https://gabrielecirulli.github.io/2048/", img: "https://upload.wikimedia.org/wikipedia/commons/1/18/2048_logo.svg" },
        { id: 2, name: "Hextris", url: "https://hextris.github.io/hextris/", img: "https://hextris.github.io/hextris/images/icon.png" },
        { id: 3, name: "Clumsy Bird", url: "https://ellisonleao.github.io/clumsy-bird/", img: "https://ellisonleao.github.io/clumsy-bird/data/img/bg.png" },
        { id: 4, name: "Sinuous", url: "https://sinuousgame.com/", img: "https://sinuousgame.com/favicon.ico" },
        { id: 5, name: "Biolab Disaster", url: "https://playbiolab.com/", img: "https://playbiolab.com/favicon.ico" }
    ];

    let myLibrary = JSON.parse(localStorage.getItem('xboxLibrary')) || [];

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav span').forEach(s => s.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.getElementById('nav-' + pageId).classList.add('active');
        render();
    }

    function buyGame(id) {
        if(!myLibrary.includes(id)) {
            myLibrary.push(id);
            localStorage.setItem('xboxLibrary', JSON.stringify(myLibrary));
            showToast();
            render();
        }
    }

    function showToast() {
        const t = document.getElementById('toast');
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    function render() {
        const storeGrid = document.getElementById('store-grid');
        const galleryGrid = document.getElementById('gallery-grid');
        const homeGrid = document.getElementById('home-grid');

        storeGrid.innerHTML = '';
        galleryGrid.innerHTML = '';
        homeGrid.innerHTML = '';

        allGames.forEach(game => {
            const isOwned = myLibrary.includes(game.id);
            
            const card = `
                <div class="tile" style="background-image: url('${game.img}')">
                    <div class="tile-label">
                        ${game.name}
                        ${isOwned ? 
                            `<button class="btn-action" onclick="window.open('${game.url}', '_blank')">PLAY</button>` : 
                            `<button class="btn-action" onclick="buyGame(${game.id})">GET FREE</button>`
                        }
                    </div>
                </div>
            `;

            if (isOwned) {
                galleryGrid.innerHTML += card;
                if(myLibrary.slice(-3).includes(game.id)) homeGrid.innerHTML += card; // Show last 3 on home
            } else {
                storeGrid.innerHTML += card;
            }
        });
    }

    // Initial Load
    render();
</script>

</body>
</html>
